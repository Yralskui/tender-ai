# Production stack: web (SQLite, фоновые задачи в том же процессе).
#
#   docker compose up -d
#
# dev.db и data/ примонтированы с хоста — переживают пересборку образа.

services:
  web:
    build: .
    command: npm run start
    ports:
      - "127.0.0.1:3000:3000"
    env_file: .env
    volumes:
      - ./dev.db:/app/dev.db
      - ./data:/app/data
    restart: unless-stopped
